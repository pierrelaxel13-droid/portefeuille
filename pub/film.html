<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pierrel &amp; Co — film 3D</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#c{position:absolute;left:50%;top:50%;transform-origin:center;cursor:pointer}
#hint{position:fixed;left:0;right:0;bottom:8px;text-align:center;font:12px Arial;color:#8A8677;pointer-events:none}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
</head><body><canvas id="c"></canvas><div id="hint">Touchez pour rejouer · nécessite WebGL</div>
<script type="module">
/* Film de 25 s : décor 3D (three.js, dossier vendor/) + textes 2D par-dessus.
   draw(t) ne dépend que du temps t : on peut donc l'enregistrer image par image.
   Paramètres d'URL : ?fmt=16x9 (paysage)  ?render=1 (pas de lecture automatique)  ?t=12 (image fixe).
   Les chiffres sont ceux d'un portefeuille d'exemple. */
import * as THREE from 'three';
import {RoundedBoxGeometry} from './vendor/RoundedBoxGeometry.js';

const QS=new URLSearchParams(location.search);
const LS=QS.get('fmt')==='16x9';
const CUT=QS.get('cut')==='15';
const W=LS?1920:1080,H=LS?1080:1920,DUR_FULL=25,DUR=CUT?15:25;
/* [début en sortie, début dans le film, vitesse] */
const MAP=[[0,0,1.5],[1.6,2.4,1.5],[4.0,6.0,1.43],[7.5,11.0,1.6],[9.5,14.2,1.5],[11.5,20.8,1.2]];
const srcT=t=>{let m=MAP[0];for(const e of MAP)if(t>=e[0])m=e;return m[1]+(t-m[0])*m[2]};
const U=LS?.72:1,ZD=LS?.68:1;   // ZD : en paysage la caméra se rapproche                               // échelle des textes
const cv=document.getElementById('c');cv.width=W;cv.height=H;cv.style.width=W+'px';cv.style.height=H+'px';
const out=cv.getContext('2d');let ctx=out;

/* ---------- outils ---------- */
const C={bg:'#0B0A10',bg2:'#201E15',bg3:'#2A2719',ink:'#F4F2E8',ink2:'#B5B1A0',ink3:'#8A8677',rule:'#3A3623',acc:'#8B74F2',acc2:'#4B21E8',gain:'#2AA96B',loss:'#D96A4E'};
const HEAD='"Archivo Black","Arial Black",Impact,sans-serif',BODY='Archivo,"Helvetica Neue",Arial,sans-serif',MONO='"IBM Plex Mono",ui-monospace,Menlo,monospace';
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3),eo5=x=>1-Math.pow(1-x,5),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eb=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const eexp=x=>x>=1?1:1-Math.pow(2,-10*x);
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const VALS=[48,20,14,10,8],NAMES=['Immobilier','PEA','Assurance-vie','Bitcoin','Livret'],AMTS=['119 340 €','49 730 €','34 810 €','24 860 €','19 890 €'];
const COLS=['#8B74F2','#2AA96B','#E0A63A','#D96A4E','#5FB3D9'],HEX=[0x8B74F2,0x2AA96B,0xE0A63A,0xD96A4E,0x5FB3D9];
const SER=[.08,.14,.1,.22,.2,.31,.28,.4,.47,.44,.58,.66,.72,.82,1];

function T(s,x,y,o={}){const{size=48,font=BODY,weight=400,color=C.ink,align='left',ls=0,alpha=1}=o;
 ctx.save();ctx.globalAlpha*=alpha;ctx.font=`${weight} ${size}px ${font}`;ctx.letterSpacing=ls+'px';
 ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillStyle=o.fill||color;ctx.fillText(s,x,y);ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function glow(c,b,f){ctx.save();ctx.shadowColor=c;ctx.shadowBlur=b;f();ctx.restore()}
function num(str,cx,y,size,color,o={}){const{weight=900,font=HEAD}=o;ctx.save();ctx.letterSpacing='0px';ctx.font=`${weight} ${size}px ${font}`;
 const cw=size*.6,sp=size*.3,ch=[...str],ws=ch.map(c=>/\d/.test(c)?cw:c===' '?sp:ctx.measureText(c).width),tot=ws.reduce((a,b)=>a+b,0);
 let x=cx-tot/2;ctx.fillStyle=color;ctx.textAlign='center';ctx.textBaseline='alphabetic';
 ch.forEach((c,i)=>{ctx.fillText(c,x+ws[i]/2,y);x+=ws[i]});ctx.restore()}
/* texte qui « claque » : échelle de 1,7 à 1, et découpe RVB juste après l'impact */
function slam(s,x,y,t,t0,o){const d=t-t0;if(d<0)return;const p=seg(d,0,.28),sc=lerp(1.7,1,eb(p));
 ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.translate(-x,-y);ctx.globalAlpha=clamp(d*9);
 if(d<.4){const k=(1-d/.4)*(o.size*.09);ctx.save();ctx.globalCompositeOperation='lighter';
  T(s,x-k,y,{...o,color:'#ff2a6d',alpha:.8});T(s,x+k,y,{...o,color:'#00e5ff',alpha:.8});ctx.restore()}
 T(s,x,y,o);ctx.restore()}
function rise(s,x,y,p,o){const size=o.size;ctx.save();ctx.beginPath();ctx.rect(0,y-size*.98,W,size*1.3);ctx.clip();T(s,x,y+(1-eo5(p))*size*1.15,o);ctx.restore()}
function chip(txt,cx,cy,color,size,p){if(p<=0)return;ctx.save();ctx.translate(cx,cy);ctx.scale(eb(p),eb(p));ctx.globalAlpha=clamp(p*3);
 ctx.font=`500 ${size}px ${MONO}`;ctx.letterSpacing='1px';const w=ctx.measureText(txt).width+size*2;
 rr(-w/2,-size*.95,w,size*1.9,size);ctx.fillStyle=color+'33';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.stroke();
 T(txt,0,size*.32,{size,font:MONO,weight:500,color,align:'center',ls:1});ctx.restore()}
function burst(t,t0,cx,cy,n,seed,sz){const dt=t-t0;if(dt<0||dt>2)return;const r=mulberry(seed);
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(let i=0;i<n;i++){const a=r()*6.283,v=300+r()*950,col=[C.acc,C.gain,'#E0A63A','#F4F2E8','#5FB3D9'][i%5],rot=r()*6,k=2.2;
  const d=v*(1-Math.exp(-k*dt))/k,x=cx+Math.cos(a)*d,y=cy+Math.sin(a)*d+300*dt*dt;
  ctx.globalAlpha=clamp(1-dt/1.7)*.95;ctx.fillStyle=col;ctx.save();ctx.translate(x,y);ctx.rotate(rot+dt*7);ctx.fillRect(-sz/2,-sz/4,sz,sz/2);ctx.restore()}
 ctx.restore()}
function donut(cx,cy,R,th,vals,cols,p,gap=.03){const tot=vals.reduce((a,b)=>a+b),full=p*Math.PI*2;let s=0;ctx.lineWidth=th;ctx.lineCap='butt';
 vals.forEach((v,i)=>{const a=v/tot*Math.PI*2,e=Math.min(s+a,full);if(e>s+.001){ctx.strokeStyle=cols[i];ctx.beginPath();ctx.arc(cx,cy,R-th/2,-Math.PI/2+s,-Math.PI/2+e-gap);ctx.stroke()}s+=a})}
function linechart(x0,y0,w,h,p,color,lw=8){const n=SER.length,k=p*(n-1),pts=[];
 for(let i=0;i<n;i++){if(i<=k)pts.push([x0+w*i/(n-1),y0+h-SER[i]*h])}
 const f=k-Math.floor(k);if(k<n-1&&f>0){const i=Math.floor(k),a=pts[i],bx=x0+w*(i+1)/(n-1),by=y0+h-SER[i+1]*h;pts.push([lerp(a[0],bx,f),lerp(a[1],by,f)])}
 if(pts.length<2)return null;
 const gr=ctx.createLinearGradient(0,y0,0,y0+h);gr.addColorStop(0,'rgba(139,116,242,.45)');gr.addColorStop(1,'rgba(139,116,242,0)');
 ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
 const last=pts[pts.length-1];ctx.lineTo(last[0],y0+h);ctx.lineTo(x0,y0+h);ctx.closePath();ctx.fillStyle=gr;ctx.fill();
 glow(color,24,()=>{ctx.beginPath();pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.strokeStyle=color;ctx.lineWidth=lw;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke()});
 return last}
function appIcon(cx,cy,s){ctx.save();ctx.translate(cx,cy);ctx.scale(s/192,s/192);ctx.translate(-96,-96);
 rr(0,0,192,192,44);ctx.fillStyle=C.acc2;ctx.fill();
 ctx.strokeStyle='#fff';ctx.lineWidth=13;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(44,124);ctx.lineTo(72,106);ctx.lineTo(96,120);ctx.lineTo(146,74);ctx.stroke();
 ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(148,72,12,0,7);ctx.fill();ctx.globalAlpha=.4;ctx.fillRect(42,146,108,6);ctx.restore()}
function wifiOff(cx,cy,s,col){ctx.save();ctx.translate(cx,cy);ctx.strokeStyle=col;ctx.lineWidth=5;ctx.lineCap='round';
 [1,.66,.33].forEach(k=>{ctx.beginPath();ctx.arc(0,s*.5,s*k,-Math.PI*.75,-Math.PI*.25);ctx.stroke()});
 ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,s*.5,4.5,0,7);ctx.fill();ctx.beginPath();ctx.moveTo(-s*.75,-s*.3);ctx.lineTo(s*.75,s*.75);ctx.stroke();ctx.restore()}
function canvasTex(w,h,draw,srgb=true){const c=document.createElement('canvas');c.width=w;c.height=h;const prev=ctx;ctx=c.getContext('2d');draw(w,h);ctx=prev;
 const tx=new THREE.CanvasTexture(c);if(srgb)tx.colorSpace=THREE.SRGBColorSpace;tx.anisotropy=4;return tx}

/* ---------- moteur 3D ---------- */
const R=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.outputColorSpace=THREE.SRGBColorSpace;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.25;
const scene=new THREE.Scene(),BG=0x0B0A10;scene.background=new THREE.Color(BG);scene.fog=new THREE.FogExp2(BG,.024);
const cam=new THREE.PerspectiveCamera(55,W/H,.1,500);
scene.add(new THREE.AmbientLight(0x7d6fd6,.9));
const key=new THREE.DirectionalLight(0xc9baff,3.2);key.position.set(-8,14,10);scene.add(key);
const rim=new THREE.DirectionalLight(0x2AA96B,1.6);rim.position.set(10,6,-12);scene.add(rim);
const camLight=new THREE.PointLight(0x9d8bff,140,60,1.4);scene.add(camLight);

/* sol : grille + plan sombre semi-transparent (les reflets passent dessous) */
const grid=new THREE.GridHelper(400,200,0x8B74F2,0x3b3266);grid.material.transparent=true;grid.material.opacity=.9;scene.add(grid);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshBasicMaterial({color:BG,transparent:true,opacity:.6}));floor.rotation.x=-Math.PI/2;floor.position.y=-.02;scene.add(floor);

/* texture de fenêtres allumées */
const rw=mulberry(11);
function windowTex(){const c=document.createElement('canvas');c.width=64;c.height=128;const g=c.getContext('2d');g.fillStyle='#000';g.fillRect(0,0,64,128);
 for(let y=4;y<124;y+=8)for(let x=4;x<60;x+=8){if(rw()<.4){g.fillStyle=rw()<.2?'#ffe6a8':'#b9a8ff';g.fillRect(x,y,4,5)}}
 const tx=new THREE.CanvasTexture(c);tx.colorSpace=THREE.SRGBColorSpace;tx.magFilter=THREE.NearestFilter;tx.wrapS=tx.wrapT=THREE.RepeatWrapping;return tx}
const WIN=windowTex();

/* horizon de la ville */
const sky=(()=>{const N=190,g=new THREE.BoxGeometry(1,1,1).translate(0,.5,0);
 const m=new THREE.MeshStandardMaterial({color:0x1b1730,metalness:.6,roughness:.35,emissive:0xffffff,emissiveMap:WIN,emissiveIntensity:.9});
 const im=new THREE.InstancedMesh(g,m,N),d=new THREE.Object3D(),r=mulberry(5),col=new THREE.Color();
 for(let i=0;i<N;i++){const a=r()*6.283,dist=36+r()*85,w=1.8+r()*3.8,h=(3+Math.pow(r(),2)*34)*(.5+dist/90);
  d.position.set(Math.cos(a)*dist,0,Math.sin(a)*dist-12);d.scale.set(w,h,1.6+r()*3.6);d.updateMatrix();im.setMatrixAt(i,d.matrix);
  col.setHSL(.68+r()*.06,.4,.25+r()*.2);im.setColorAt(i,col)}
 const grp=new THREE.Group();grp.add(im);scene.add(grp);return grp})();

/* tours : 5 classes d'actifs, hauteur proportionnelle à la part */
const TX=[0,-2.9,2.9,-5.8,5.8],TH=[10.6,4.4,3.1,2.2,1.8];
const towers=NAMES.map((n,i)=>{const grp=new THREE.Group(),tex=WIN.clone();tex.repeat.set(1,Math.max(1,TH[i]/2.6));tex.needsUpdate=true;
 const g=new THREE.BoxGeometry(2.1,1,2.1).translate(0,.5,0);
 const body=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x16131f,metalness:.75,roughness:.25,emissive:0xffffff,emissiveMap:tex,emissiveIntensity:.55}));
 const glowM=new THREE.MeshStandardMaterial({color:HEX[i],emissive:HEX[i],emissiveIntensity:.9,metalness:.2,roughness:.5,transparent:true,opacity:.55});
 const edge=new THREE.LineSegments(new THREE.EdgesGeometry(g),new THREE.LineBasicMaterial({color:HEX[i]}));
 const cap=new THREE.Mesh(new THREE.BoxGeometry(2.2,.16,2.2).translate(0,.08,0),glowM);
 grp.add(body,edge,cap);grp.position.set(TX[i],0,0);
 /* reflet : copie inversée sous le sol */
 const mir=new THREE.Group();mir.add(new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:HEX[i],transparent:true,opacity:.28})));mir.position.copy(grp.position);
 scene.add(grp,mir);return{grp,mir,body,cap,edge}});
function labelTex(i){return canvasTex(512,180,(w,h)=>{ctx.clearRect(0,0,w,h);T(NAMES[i],w/2,84,{size:70,font:HEAD,weight:900,color:'#fff',align:'center',ls:-2});T(VALS[i]+' %',w/2,150,{size:56,font:MONO,weight:500,color:COLS[i],align:'center'})})}
const labels=NAMES.map((n,i)=>{const s=new THREE.Sprite(new THREE.SpriteMaterial({map:labelTex(i),transparent:true,depthWrite:false,fog:false}));s.scale.set(4.2,1.48,1);scene.add(s);return s});

/* onde de choc au sol */
const shock=new THREE.Mesh(new THREE.RingGeometry(.94,1,96),new THREE.MeshBasicMaterial({color:0xb9a8ff,transparent:true,blending:THREE.AdditiveBlending,side:THREE.DoubleSide,depthWrite:false}));
shock.rotation.x=-Math.PI/2;shock.position.y=.05;scene.add(shock);

/* braises qui montent */
const emb=(()=>{const N=420,g=new THREE.BufferGeometry(),r=mulberry(9),p=new Float32Array(N*3);g.setAttribute('position',new THREE.BufferAttribute(p,3));
 const seed=[];for(let i=0;i<N;i++)seed.push([(r()-.5)*70,r()*30,(r()-.5)*70-8,.6+r()*2.2]);
 const pts=new THREE.Points(g,new THREE.PointsMaterial({color:0xc9baff,size:.16,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false}));
 pts.frustumCulled=false;scene.add(pts);return{pts,seed,p}})();

/* accélération : lignes de vitesse (intro) */
const warp=(()=>{const N=900,g=new THREE.BufferGeometry(),r=mulberry(3),pos=new Float32Array(N*6),col=new Float32Array(N*6),seed=[];
 for(let i=0;i<N;i++){const a=r()*6.283,rad=1.2+Math.pow(r(),.6)*16;seed.push([Math.cos(a)*rad,Math.sin(a)*rad,r()*130,.6+r()*.8]);
  const c=new THREE.Color().setHSL(.7+r()*.05,.7,.55+r()*.4);for(let k=0;k<2;k++){col.set([c.r,c.g,c.b],i*6+k*3)}}
 g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
 const ls=new THREE.LineSegments(g,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.95,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
 ls.frustumCulled=false;scene.add(ls);return{ls,seed,pos}})();

/* cartes-comptes qui tourbillonnent (chaos) */
function cardTex(i){return canvasTex(640,380,(w,h)=>{ctx.clearRect(0,0,w,h);rr(6,6,w-12,h-12,34);ctx.fillStyle='#1b1830';ctx.fill();ctx.strokeStyle=COLS[i];ctx.lineWidth=6;ctx.stroke();
 rr(6,6,w-12,64,[34,34,0,0]);ctx.fillStyle=COLS[i];ctx.fill();
 T(NAMES[i],36,148,{size:64,font:HEAD,weight:900,color:'#fff',ls:-2});T(AMTS[i],36,262,{size:78,font:MONO,weight:500,color:COLS[i]});T('COMPTE '+(i+1)+' / 5',36,340,{size:28,font:MONO,color:'#8A8677',ls:4})})}
const cards=NAMES.map((n,i)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(3.4,2.02),new THREE.MeshBasicMaterial({map:cardTex(i),transparent:true,side:THREE.DoubleSide,toneMapped:false,fog:false}));m.frustumCulled=false;scene.add(m);return m});
const GL=['€','%','+','▲','1','4','8','2','7','€','%','+'];
const glyphMat=GL.map(gl=>new THREE.SpriteMaterial({map:canvasTex(128,128,(w,h)=>{ctx.clearRect(0,0,w,h);glow('#8B74F2',18,()=>T(gl,w/2,92,{size:96,font:HEAD,weight:900,color:'#d9d0ff',align:'center'}))}),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
const rg=mulberry(21),bits=Array.from({length:70},(_,i)=>{const s=new THREE.Sprite(glyphMat[i%glyphMat.length]);s.frustumCulled=false;scene.add(s);return{s,a0:rg()*6.283,r:2.2+rg()*8,z:-5-rg()*16,y:(rg()-.5)*6,w:.7+rg()*1.6,sz:.5+rg()*1.1}});

/* ruban = la courbe de performance en 3D */
const ribbon=(()=>{const pts=SER.map((v,i)=>new THREE.Vector3(i*1.7-12,.6+v*9.5,Math.sin(i*.8)*1.8)),curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',.4);
 const SEGS=420,RAD=10,tube=new THREE.TubeGeometry(curve,SEGS,.11,RAD,false),halo=new THREE.TubeGeometry(curve,SEGS,.24,RAD,false);
 const m1=new THREE.Mesh(tube,new THREE.MeshBasicMaterial({color:0xd9d0ff,toneMapped:false})),m2=new THREE.Mesh(halo,new THREE.MeshBasicMaterial({color:0x8B74F2,transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}));
 const drops=new THREE.BufferGeometry();const dp=[];pts.forEach(p=>{dp.push(p.x,0,p.z,p.x,p.y,p.z)});drops.setAttribute('position',new THREE.Float32BufferAttribute(dp,3));
 const dl=new THREE.LineSegments(drops,new THREE.LineBasicMaterial({color:0x8B74F2,transparent:true,opacity:.35}));
 const head=new THREE.Sprite(new THREE.SpriteMaterial({map:canvasTex(128,128,(w,h)=>{const g=ctx.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.25,'rgba(185,168,255,.8)');g.addColorStop(1,'rgba(139,116,242,0)');ctx.fillStyle=g;ctx.fillRect(0,0,128,128)}),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));head.scale.set(2.4,2.4,1);
 const grp=new THREE.Group();grp.add(m1,m2,dl,head);grp.position.set(0,0,0);scene.add(grp);return{grp,curve,m1,m2,head,SEGS,RAD,dl}})();

/* tunnel de 14 indicateurs */
const tunnel=(()=>{const grp=new THREE.Group(),panels=[],hoops=[];
 const vals=['62 %','+8,4 %','3,1 j','17 %','− 4,2 %','5 / 9','1,8 ×'];
 function glyphDraw(k,x,y,s){ctx.save();ctx.translate(x,y);ctx.strokeStyle=C.acc;ctx.fillStyle=C.acc;ctx.lineWidth=7;ctx.lineCap='round';
  if(k===0){[.5,.9,.65,.35,.75].forEach((v,i)=>{const hh=v*s;rr(i*(s/5)+2,s-hh,s/5-8,hh,4);ctx.fill()})}
  else if(k===1){ctx.strokeStyle=C.rule;ctx.beginPath();ctx.arc(s/2,s/2,s*.38,0,7);ctx.stroke();ctx.strokeStyle=C.gain;ctx.beginPath();ctx.arc(s/2,s/2,s*.38,-Math.PI/2,-Math.PI/2+Math.PI*1.4);ctx.stroke()}
  else if(k===2){ctx.beginPath();[.7,.5,.6,.3,.4,.1].forEach((v,i)=>{i?ctx.lineTo(i*s/5,v*s+8):ctx.moveTo(0,v*s+8)});ctx.stroke()}
  else if(k===3){ctx.strokeStyle=C.rule;ctx.beginPath();ctx.arc(s/2,s*.75,s*.42,Math.PI,0);ctx.stroke();ctx.strokeStyle=C.loss;ctx.beginPath();ctx.arc(s/2,s*.75,s*.42,Math.PI,Math.PI+Math.PI*.62);ctx.stroke()}
  else{for(let i=0;i<9;i++){ctx.globalAlpha=(i*5+3)%7<4?1:.25;ctx.beginPath();ctx.arc((i%3)*s/2.6+10,Math.floor(i/3)*s/2.6+10,7,0,7);ctx.fill()}}
  ctx.restore()}
 for(let i=0;i<14;i++){const tex=canvasTex(560,250,(w,h)=>{ctx.clearRect(0,0,w,h);rr(8,8,w-16,h-16,44);ctx.fillStyle='rgba(32,30,21,.94)';ctx.fill();ctx.strokeStyle='#8B74F2';ctx.lineWidth=5;ctx.stroke();
