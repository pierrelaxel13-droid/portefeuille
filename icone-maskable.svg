<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Pierrel &amp; Co — portefeuille">
  <!-- Variante « maskable » : le système peut rogner jusqu'aux 20 % du bord,
       donc tout le dessin tient dans le cercle central. -->
