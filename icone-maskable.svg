  <path d="M146 326 L214 274 L274 298 L378 194"
        fill="none" stroke="#F2F0E9" stroke-width="28"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="378" cy="194" r="24" fill="#F2F0E9"/>
  <path d="M146 368 H378" stroke="#F2F0E9" stroke-opacity=".38"
        stroke-width="14" stroke-linecap="round"/>
</svg>
