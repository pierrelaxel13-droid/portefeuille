# ============================================================
# SONDER UNE ADRESSE, DEPUIS UNE MACHINE QUI A LE DROIT
#
# L'environnement ou ce code est ecrit n'a pas d'acces sortant : il
# refuse tous les hotes externes. Deviner si une adresse repond, ce
# qu'elle rend et si un navigateur aura le droit de l'appeler revient
# a inventer — et on l'a deja paye une fois, avec une liste de flux de
# presse choisie sur l'intention dont deux sur trois etaient mortes.
#
# Cette tache repond a la question depuis une machine qui, elle, a
# l'acces : code HTTP, type de contenu, EN-TETE CORS (c'est celle-la
# qui decide si la page pourra appeler l'adresse directement), et les
# premiers caracteres de la reponse.
#
# Elle ne tourne qu'a la main, elle ne lit que ce qu'on lui donne, et
# elle n'ecrit rien dans le depot.
# ============================================================
name: Sonder une adresse

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Adresses a sonder, separees par des virgules."
        required: true

permissions:
  contents: read

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger
        env:
          URLS: ${{ inputs.urls }}
        run: |
          IFS=',' read -ra L <<< "$URLS"
          for u in "${L[@]}"; do
            u="$(echo "$u" | xargs)"
            [ -z "$u" ] && continue
            echo "=============================================="
            echo "ADRESSE : $u"
            # La forme convenue d'un navigateur : certains serveurs
            # refusent un agent inconnu, et le refus n'aurait alors
            # rien a voir avec l'adresse.
            code=$(curl -s -o /tmp/corps -D /tmp/tetes -w '%{http_code}' --max-time 20 \
              -H 'Origin: https://pierrelaxel13-droid.github.io' \
              -H 'Accept: application/json' \
              -A 'Mozilla/5.0 (compatible; pierrelco-sonde/1.0)' "$u" || echo 000)
            echo "CODE   : $code"
            echo "TYPE   : $(grep -i '^content-type:' /tmp/tetes | head -1 | tr -d '\r')"
            echo "CORS   : $(grep -i '^access-control-allow-origin:' /tmp/tetes | head -1 | tr -d '\r' || echo 'AUCUN — un navigateur ne pourra pas appeler cette adresse directement')"
            echo "DEBUT  : $(head -c 320 /tmp/corps | tr -d '\n')"
            echo
          done
