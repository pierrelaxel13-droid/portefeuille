# ============================================================
# LES TITRES DU JOUR, DEUX FOIS PAR JOUR
#
# Cette tache tourne chez GitHub, pas chez vous : rien a installer,
# rien a maintenir, rien a payer. Elle lit les flux, ecrit
# « actu.json » a cote de « index.html », et ne valide le fichier que
# s'il a change — un depot ne doit pas accumuler un commit par jour
# pour dire la meme chose.
#
# La page lit ce fichier en MEME ORIGINE : aucune permission a
# demander a personne. Si le relais Cloudflare est deploye un jour, il
# reprendra la main tout seul — la page essaie les deux.
#
# POUR CHANGER LES SOURCES, sans toucher a un fichier : Settings →
# Secrets and variables → Actions → Variables → ACTU_FLUX, au format
# « Nom|adresse », separes par des virgules.
#
# ET LES SUJETS GARDES, au meme endroit : ACTU_SUJETS, des termes
# separes par des virgules. Un titre n'est garde que s'il en contient
# un — la rubrique « economie » d'un journal, c'est l'economie du
# pays, et ce site parle d'un patrimoine.
#
# A SAVOIR : GitHub desactive une tache planifiee apres soixante jours
# sans aucune activite dans le depot, et previent par courriel. Un
# « Run workflow » suffit a la relancer.
# ============================================================
name: Les titres du jour

on:
  schedule:
    # 06:07 et 16:07 UTC. Pas a l'heure pile : tout le monde s'y met,
    # et les taches planifiees y partent avec du retard.
    - cron: '7 6,16 * * *'
  # ET A CHAQUE MISE EN LIGNE, pour que la rubrique ne soit pas vide
  # entre le deploiement et la premiere heure ronde. Le commit que
  # cette tache pousse ne la redeclenche pas : GitHub ne rejoue pas un
  # workflow sur un commit signe par son propre jeton. Et « actu.json »
  # est exclu par precaution, pour que ce soit vrai deux fois.
  push:
    branches: [main]
    paths-ignore:
      - 'actu.json'
  # ET A LA MAIN, avec la possibilite d'essayer une AUTRE liste pour
  # ce passage-la seulement. Sans ce champ, verifier qu'une adresse
  # repond demandait de changer la variable du depot, de lancer, puis
  # de la remettre — trois gestes pour une question qui en vaut un.
  workflow_dispatch:
    inputs:
      flux:
        description: "Liste a essayer pour ce passage (Nom|adresse, separes par des virgules). Vide : la liste habituelle."
        required: false
        default: ''
      sujets:
        description: "Sujets a essayer pour ce passage (termes separes par des virgules). Vide : la liste habituelle."
        required: false
        default: ''
      sec:
        description: "Passage a sec : lire, afficher, et ne RIEN valider dans le depot."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: actu
  cancel-in-progress: false

jobs:
  titres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lire les flux
        env:
          # Le champ du lancement a la main l'emporte sur la variable
          # du depot, qui l'emporte sur la liste par defaut du
          # programme. Trois niveaux, du plus ponctuel au plus durable.
          ACTU_FLUX: ${{ inputs.flux != '' && inputs.flux || vars.ACTU_FLUX }}
          # IL FAUT LE PASSER EXPLICITEMENT : une variable du depot
          # n'entre pas d'elle-meme dans l'environnement d'une etape.
          # Sans cette ligne, ACTU_SUJETS serait documente et inerte.
          ACTU_SUJETS: ${{ inputs.sujets != '' && inputs.sujets || vars.ACTU_SUJETS }}
        # Un echec ici est VOLONTAIREMENT visible : si une adresse a
        # change, mieux vaut une croix rouge qu'une rubrique qui
        # repete les titres d'avant-hier pendant six mois. L'ancien
        # fichier reste en place.
        run: node actu/actu.mjs > actu.json.neuf

      # UN PASSAGE A SEC NE PUBLIE RIEN. Verifier qu'une adresse repond,
      # ou qu'un sujet attrape bien ce qu'il doit, ne doit pas changer
      # ce que le site montre : une mesure qui modifie ce qu'elle mesure
      # n'est pas une mesure. On affiche le resultat, et on s'arrete.
      - name: Montrer sans rien valider
        if: ${{ inputs.sec }}
        run: cat actu.json.neuf

      - name: Ne valider que si ca a change
        if: ${{ !inputs.sec }}
        run: |
          # `require` choisit son interpreteur sur l'EXTENSION : un
          # fichier « .neuf » serait lu comme du JavaScript, et un
          # objet JSON n'en est pas. On lit donc le fichier et on
          # l'analyse soi-meme. La date et le journal des flux sont
          # retires avant la comparaison : ils changent a chaque
          # passage sans qu'aucun titre ait bouge.
          node -e '
            const fs = require("fs");
            // On compare les titres ET l etat de chaque source, sans
            // les durees : une source qui revient ou qui tombe est une
            // nouvelle en soi, et le journal des flux doit la dire
            // dans le fichier. Sans cela il resterait fige sur le
            // diagnostic du premier passage, ce qui est pire qu une
            // absence de diagnostic.
            const sans = p => {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              delete j.fait;
              j.flux = (j.flux || []).map(f => f.nom + ":" + f.etat + ":" + f.titres);
              return JSON.stringify(j);
            };
            const neuf = sans("actu.json.neuf");
            const vieux = fs.existsSync("actu.json") ? sans("actu.json") : null;
            fs.writeFileSync("_change", neuf === vieux ? "non" : "oui");
          '
          if [ "$(cat _change)" = "non" ]; then
            echo "les memes titres qu'au dernier passage — rien a valider."
            rm -f actu.json.neuf _change
            exit 0
          fi
          rm -f _change
          mv actu.json.neuf actu.json
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add actu.json
          git commit -m "Les titres du jour — $(date -u '+%Y-%m-%d %H:%M UTC')"
          # DEUX PASSAGES RAPPROCHES SE MARCHENT DESSUS. Celui qui part
          # en second a ete cree a partir d'un « main » que le premier a
          # depuis fait avancer : son envoi est refuse, et la tache
          # echoue sur un conflit qui n'en est pas un — personne n'a
          # touche aux memes lignes. On rejoue par-dessus ce qui est
          # arrive entre-temps, et on reessaie trois fois : au-dela,
          # c'est autre chose qu'une course et il faut le voir.
          for essai in 1 2 3; do
            git push && exit 0
            echo "envoi refuse (essai $essai) — on rejoue par-dessus le depot."
            git fetch origin main
            git rebase FETCH_HEAD || { git rebase --abort; exit 1; }
            sleep $((essai * 3))
          done
          echo "trois envois refuses d'affilee : ce n'est pas une course."
          exit 1
